# =============================================================================
# PDM - Build & Push Docker Images (GitHub Actions)
#
# Trigger:
#   1. push git tag ที่ขึ้นต้นด้วย v*  (เช่น v1.2.3)  -> build + push อัตโนมัติ
#   2. Manual: Actions > "Build & Push Images" > Run workflow
#
# Output (ลง ghcr.io ของ owner repo นี้):
#   ghcr.io/<owner>/pdm-backend:v1.2.3    (+ tag :latest)
#   ghcr.io/<owner>/pdm-frontend:v1.2.3   (+ tag :latest)
#
# บน production server: ตั้ง IMAGE_REGISTRY=ghcr.io/<owner>/ ใน .env
# แล้ว deploy ตาม tag:
#   IMAGE_TAG=v1.2.3 ./scripts/deploy-prod.sh       # deploy
#   IMAGE_TAG=v1.1.0 ./scripts/deploy-prod.sh       # rollback
#
# หมายเหตุ: ใช้ `docker buildx bake -f docker-compose.prod.yml` จึงใช้
# compose file เป็น source of truth เดียว (build args/ชื่อ image ไม่ซ้ำซ้อน)
# =============================================================================
name: Build & Push Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (เช่น v1.2.3) — ถ้าเว้นว่างจะใช้ sha-<commit>"
        required: false
        type: string
      update_latest:
        description: "อัปเดต tag :latest ด้วย (true สำหรับ release ปกติ)"
        required: false
        default: true
        type: boolean

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}/"
  # GitHub-hosted runner เป็น amd64 (x86_64) เสมอ — บังคับไว้กัน catch
  # ถ้าโดน interpolate จาก .env ที่เผลอ commit ขึ้นมา
  ORACLE_ARCH: x86_64

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # เลือก tag: manual input > tag ที่ push > fallback เป็น sha-<commit>
      - name: Resolve IMAGE_TAG
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # Build + push ทั้ง backend และ frontend ตามชื่อใน docker-compose.prod.yml
      # (ใช้ GHA cache ลดเวลารีโหลด Oracle RPM / composer install ในรอบถัดไป)
      - name: Build & push images (bake from compose)
        run: |
          # Bake validates service env_file paths while loading Compose, even
          # though these images only need build-time args from workflow env.
          if [ ! -f .env ]; then touch .env; fi
          docker buildx bake \
            -f docker-compose.prod.yml \
            --provenance false \
            --push \
            --set backend.cache-from=type=gha \
            --set backend.cache-to=type=gha,mode=max \
            --set frontend.cache-from=type=gha \
            --set frontend.cache-to=type=gha,mode=max
          echo "Pushed:"
          echo "  ${IMAGE_REGISTRY}pdm-backend:${IMAGE_TAG}"
          echo "  ${IMAGE_REGISTRY}pdm-frontend:${IMAGE_TAG}"

      # อัปเดต tag :latest ใน registry โดยตรง (Bake --push ไม่ได้โหลด image เข้า local daemon)
      - name: Update :latest tags
        if: ${{ github.event.inputs.update_latest != 'false' }}
        run: |
          if [ "${IMAGE_TAG}" != "latest" ]; then
            for img in pdm-backend pdm-frontend; do
              docker buildx imagetools create \
                --tag "${IMAGE_REGISTRY}${img}:latest" \
                "${IMAGE_REGISTRY}${img}:${IMAGE_TAG}"
            done
          fi

      - name: Show final image tags
        run: |
          echo "Released images (IMAGE_TAG=${IMAGE_TAG}):"
          echo "  ${IMAGE_REGISTRY}pdm-backend:${IMAGE_TAG}"
          echo "  ${IMAGE_REGISTRY}pdm-frontend:${IMAGE_TAG}"
          if [ "${{ github.event.inputs.update_latest }}" != "false" ]; then
            echo "  ${IMAGE_REGISTRY}pdm-backend:latest"
            echo "  ${IMAGE_REGISTRY}pdm-frontend:latest"
          fi