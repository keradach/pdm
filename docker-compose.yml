# ==============================================================================
# PDM - Docker Compose (LOCAL DEVELOPMENT)
#
# Runs local development stack:
#   - oracle-db: Oracle 23-slim container
#   - backend: Laravel 13 (PHP 8.4 FPM) with bind mount for hot reload
#   - backend-nginx: Nginx reverse proxy (:8000)
#   - frontend: Vue 3 Vite dev server with HMR (:5173)
#
# Usage:
#   docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Oracle Database (Container for Local Development)
  # ----------------------------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: pdm-oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
      APP_USER: ${DB_USERNAME:-pdm_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      pdm-net:
        aliases:
          - frontend
          - backend
          - backend-nginx

  # ----------------------------------------------------------------------------
  # Laravel Backend (PHP-FPM) - Bind mounted for local development
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:8.4-fpm-bookworm}
        ORACLE_ARCH: ${ORACLE_ARCH:-}
        ORACLE_INSTANTCLIENT_VERSION: ${ORACLE_INSTANTCLIENT_VERSION:-23.26.3.0.0}
        ORACLE_INSTANTCLIENT_ROOT: ${ORACLE_INSTANTCLIENT_ROOT:-2326300}
    container_name: pdm-backend
    restart: unless-stopped
    depends_on:
      oracle-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/var/www
      - ./.env:/var/www/.env:ro
    networks:
      pdm-net:
        aliases:
          - frontend
          - backend-nginx
          - oracle-db

  # ----------------------------------------------------------------------------
  # Nginx Web Server for Backend API
  # ----------------------------------------------------------------------------
  backend-nginx:
    image: nginx:1.27-alpine
    container_name: pdm-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    networks:
      pdm-net:
        aliases:
          - frontend
          - backend
          - oracle-db

  # ----------------------------------------------------------------------------
  # Vue 3 Frontend - Vite Dev Server (Hot Reload)
  # ----------------------------------------------------------------------------
  frontend:
    image: node:22-alpine
    container_name: pdm-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend-nginx
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - APP_ENV=local
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - VITE_BACKEND_PROXY_URL=http://backend-nginx:80
    networks:
      pdm-net:
        aliases:
          - backend-nginx
          - backend
          - oracle-db

networks:
  pdm-net:
    driver: bridge

volumes:
  oracle-data:
