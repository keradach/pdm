# ==========================================================================
# PDM - Docker Compose (single file for LOCAL and PRODUCTION)
#
# Mode is selected via COMPOSE_PROFILES in .env:
#   COMPOSE_PROFILES=local       -> Vite dev server + bind mounts (hot reload)
#   COMPOSE_PROFILES=production  -> built static assets + baked images
#
# Usage (same command for both modes):
#   docker compose up -d --build
# ==========================================================================

services:
  # ---------------------------------------------------------------------
  # Oracle Database (shared by both modes)
  # ---------------------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: pdm-oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
      APP_USER: ${DB_USERNAME:-pdm_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - pdm-net

  # =====================================================================
  # LOCAL MODE (COMPOSE_PROFILES=local)
  # Source code is bind-mounted -> edit on host, changes apply instantly.
  # =====================================================================

  # ---- Laravel backend (PHP-FPM) with bind mount ----
  backend:
    profiles: ["local"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:8.4-fpm-bookworm}
        ORACLE_ARCH: ${ORACLE_ARCH:-}
        ORACLE_INSTANTCLIENT_VERSION: ${ORACLE_INSTANTCLIENT_VERSION:-23.26.3.0.0}
        ORACLE_INSTANTCLIENT_ROOT: ${ORACLE_INSTANTCLIENT_ROOT:-2326300}
    container_name: pdm-local-backend
    restart: unless-stopped
    depends_on:
      - oracle-db
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ./backend:/var/www
    networks:
      - pdm-net

  # ---- nginx in front of Laravel (local) ----
  backend-nginx:
    profiles: ["local"]
    image: nginx:1.27-alpine
    container_name: pdm-local-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    networks:
      - pdm-net

  # ---- Vue 3 frontend - Vite dev server with hot-reload (local) ----
  frontend-node:
    profiles: ["local"]
    image: node:22-alpine
    container_name: pdm-local-frontend-node
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    environment:
      - APP_ENV=local
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    networks:
      - pdm-net

  # =====================================================================
  # PRODUCTION MODE (COMPOSE_PROFILES=production)
  # Code is baked into images at build time -> NO bind mounts.
  # Frontend serves built static assets via nginx.
  # =====================================================================

  # ---- Laravel backend (PHP-FPM) - baked image, no bind mount ----
  backend-prod:
    profiles: ["production"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:8.4-fpm-bookworm}
        ORACLE_ARCH: ${ORACLE_ARCH:-}
        ORACLE_INSTANTCLIENT_VERSION: ${ORACLE_INSTANTCLIENT_VERSION:-23.26.3.0.0}
        ORACLE_INSTANTCLIENT_ROOT: ${ORACLE_INSTANTCLIENT_ROOT:-2326300}
    image: pdm-backend:latest
    container_name: pdm-prod-backend
    restart: unless-stopped
    depends_on:
      - oracle-db
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - pdm-net

  # ---- nginx in front of Laravel (production) ----
  backend-nginx-prod:
    profiles: ["production"]
    image: nginx:1.27-alpine
    container_name: pdm-prod-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend-prod
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    networks:
      - pdm-net

  # ---- Vue 3 frontend - built static assets served by nginx (production) ----
  frontend:
    profiles: ["production"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://pdmrc.doae.go.th/api}
    image: pdm-frontend:latest
    container_name: pdm-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx-prod
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - pdm-net

networks:
  pdm-net:
    driver: bridge

volumes:
  oracle-data: