# ==========================================================================
# PDM - Local Development / Testing (default)
# Laravel 13 (API) + Vue 3 (Vite dev server) + Oracle Database
#
# Usage:
#   docker compose up -d --build
#   Frontend (Vite HMR): http://localhost:5173
#   Backend API:         http://localhost:8000
#
# For production, use:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# ==========================================================================

services:
  # ---------------------------------------------------------------------
  # Oracle Database (Oracle Free / XE image, published by Oracle on
  # container-registry.oracle.com and mirrored on Docker Hub as
  # "gvenzl/oracle-free"). You may replace this with a connection string
  # to an existing Oracle instance instead of running it in Docker -
  # in that case just remove this service and point DB_HOST/DB_PORT in
  # backend/.env at your real database.
  # ---------------------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: pdm-local-oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
      APP_USER: ${DB_USERNAME:-pdm_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # Laravel 13 API backend (PHP-FPM), fronted by nginx.
  # Uses a single Dockerfile (backend/Dockerfile) based on Debian bookworm.
  # Because the container carries its own distro, the same image runs on any
  # Docker host: macOS (Apple Silicon M2 / Intel) and Linux VMs (e.g. Alpine
  # Linux 3.23) alike. Only ORACLE_ARCH needs to match the host CPU:
  #   arm64 (Apple Silicon / ARM VM) or amd64 (Intel/AMD VM).
  #
  # Composer dependencies are managed on the HOST (not inside the image):
  #   cd backend && composer install
  # The ./backend directory is bind-mounted into the container, so any
  # composer changes on the host are immediately reflected at runtime.
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # PHP_BASE_IMAGE can be swapped via .env if a different base is wanted.
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:8.4-fpm-bookworm}
        # Auto-detected from host via TARGETARCH; override via .env if needed.
        ORACLE_ARCH: ${ORACLE_ARCH:-}
        ORACLE_INSTANTCLIENT_VERSION: ${ORACLE_INSTANTCLIENT_VERSION:-23.26.3.0.0}
        ORACLE_INSTANTCLIENT_ROOT: ${ORACLE_INSTANTCLIENT_ROOT:-2326300}
    container_name: pdm-local-backend
    restart: unless-stopped
    depends_on:
      - oracle-db
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ./backend:/var/www
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # nginx in front of the Laravel PHP-FPM backend
  # ---------------------------------------------------------------------
  backend-nginx:
    image: nginx:1.27-alpine
    container_name: pdm-local-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # Vue 3 frontend - Vite dev server with hot-reload.
  # `--host 0.0.0.0` makes Vite/HMR reachable from outside the container
  # (Docker Desktop on Mac and Linux VM alike).
  #   http://localhost:5173
  # ---------------------------------------------------------------------
  frontend-node:
    image: node:22-alpine
    container_name: pdm-local-frontend-node
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${DEV_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    environment:
      - APP_ENV=local
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    networks:
      - pdm-net

networks:
  pdm-net:
    driver: bridge

volumes:
  oracle-data:
