# ==========================================================================
# PDM - Plant Disaster Monitoring Platform
# Laravel 13 (API) + Vue 3 (SPA) + Oracle Database
# ==========================================================================

services:
  # ---------------------------------------------------------------------
  # Oracle Database (Oracle Free / XE image, published by Oracle on
  # container-registry.oracle.com and mirrored on Docker Hub as
  # "gvenzl/oracle-free"). You may replace this with a connection string
  # to an existing Oracle instance instead of running it in Docker -
  # in that case just remove this service and point DB_HOST/DB_PORT in
  # backend/.env at your real database.
  # ---------------------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: pdm-oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
      APP_USER: ${DB_USERNAME:-pdm_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # Laravel 13 API backend (PHP-FPM), fronted by nginx.
  # Uses a single Dockerfile (backend/Dockerfile) based on Debian bookworm.
  # Because the container carries its own distro, the same image runs on any
  # Docker host: macOS (Apple Silicon M2 / Intel) and Linux VMs (e.g. Alpine
  # Linux 3.23) alike. Only ORACLE_ARCH needs to match the host CPU:
  #   arm64 (Apple Silicon / ARM VM) or amd64 (Intel/AMD VM).
  #
  # Composer dependencies are managed on the HOST (not inside the image):
  #   cd backend && composer install
  # The ./backend directory is bind-mounted into the container, so any
  # composer changes on the host are immediately reflected at runtime.
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # PHP_BASE_IMAGE can be swapped via .env if a different base is wanted.
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:8.4-fpm-bookworm}
        # Auto-detected from host via TARGETARCH; override via .env if needed.
        ORACLE_ARCH: ${ORACLE_ARCH:-}
        ORACLE_INSTANTCLIENT_VERSION: ${ORACLE_INSTANTCLIENT_VERSION:-23.26.3.0.0}
        ORACLE_INSTANTCLIENT_ROOT: ${ORACLE_INSTANTCLIENT_ROOT:-2326300}
    container_name: pdm-backend
    restart: unless-stopped
    depends_on:
      - oracle-db
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # nginx in front of the Laravel PHP-FPM backend
  # ---------------------------------------------------------------------
  backend-nginx:
    image: nginx:1.27-alpine
    container_name: pdm-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # Vue 3 frontend - nginx (serves the built static assets).
  # Node.js is kept in its own `frontend-node` container (below) so the
  # nginx image stays lean and has no Node runtime. It serves whatever is
  # in ./frontend/dist (produced by `frontend-node`).
  # ---------------------------------------------------------------------
  frontend-nginx:
    image: nginx:1.27-alpine
    container_name: pdm-frontend-nginx
    restart: unless-stopped
    depends_on:
      - frontend-node
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # Vue 3 frontend - Node.js container (separated from nginx).
  # Runs `npm run build` when APP_ENV=production, otherwise runs the Vite
  # dev server with hot-reload. `--host 0.0.0.0` makes Vite/HMR reachable
  # from outside the container (Docker Desktop on Mac and Linux VM alike).
  #   dev:        docker compose up frontend-node   -> http://localhost:5173
  #   production: APP_ENV=production docker compose up frontend-node
  # ---------------------------------------------------------------------
  frontend-node:
    image: node:22-alpine
    container_name: pdm-frontend-node
    restart: ${NODE_RESTART:-unless-stopped}
    working_dir: /app
    command: >
      sh -c "
      if [ \"$${APP_ENV}\" = \"production\" ]; then
        npm install && npm run build
      else
        npm install && npm run dev -- --host 0.0.0.0
      fi
      "
    ports:
      - "${DEV_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    environment:
      - APP_ENV=${APP_ENV:-local}
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    networks:
      - pdm-net

networks:
  pdm-net:
    driver: bridge

volumes:
  oracle-data:
