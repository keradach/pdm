# ==========================================================================
# PDM - Production Deployment
# Laravel 13 (API) + Vue 3 (built static assets) + Oracle Database
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   Frontend Web: https://pdmrc.doae.go.th
#   Backend API:  https://pdmrc.doae.go.th/api
#
# HTTPS is terminated by Caddy (auto Let's Encrypt). Caddy is the only
# service exposing ports 80/443 to the host. backend-nginx and frontend
# are only reachable inside the pdm-net network.
# ==========================================================================

services:
  # ---------------------------------------------------------------------
  # Oracle Database (Oracle Free / XE image)
  # ---------------------------------------------------------------------
  # oracle-db:
  #   image: gvenzl/oracle-free:23-slim
  #   container_name: pdm-prod-oracle-db
  #   restart: unless-stopped
  #   environment:
  #     ORACLE_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
  #     APP_USER: ${DB_USERNAME:-pdm_user}
  #     APP_USER_PASSWORD: ${DB_PASSWORD:-OraclePDM_2025}
  #   ports:
  #     - "${DB_PORT:-1521}:1521"
  #   volumes:
  #     - oracle-data:/opt/oracle/oradata
  #   healthcheck:
  #     test: ["CMD", "healthcheck.sh"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #   networks:
  #     - pdm-net

  # ---------------------------------------------------------------------
  # Laravel 13 API backend (PHP-FPM)
  # Source code is baked into the image at build time (COPY . /var/www/),
  # NO bind mount - files cannot be modified at runtime.
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:8.4-fpm-bookworm}
        ORACLE_ARCH: ${ORACLE_ARCH:-}
        ORACLE_INSTANTCLIENT_VERSION: ${ORACLE_INSTANTCLIENT_VERSION:-23.26.3.0.0}
        ORACLE_INSTANTCLIENT_ROOT: ${ORACLE_INSTANTCLIENT_ROOT:-2326300}
    image: pdm-backend:latest
    container_name: pdm-prod-backend
    restart: unless-stopped
    # depends_on:
    #   - oracle-db
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # nginx in front of the Laravel PHP-FPM backend
  # Serves the public/ directory from the shared backend-public volume.
  # No host ports exposed - only reachable via Caddy on pdm-net.
  # ---------------------------------------------------------------------
  backend-nginx:
    image: nginx:1.27-alpine
    container_name: pdm-prod-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # Vue 3 frontend - built as static assets, served by nginx.
  # Multi-stage build: node build stage -> nginx runtime. VITE_API_BASE_URL
  # is baked in at build time, so rebuilding is required if it changes.
  # No host ports exposed - only reachable via Caddy on pdm-net.
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://pdmrc.doae.go.th/api}
    image: pdm-frontend:latest
    container_name: pdm-prod-frontend
    restart: unless-stopped
    networks:
      - pdm-net

  # ---------------------------------------------------------------------
  # Caddy - HTTPS reverse proxy (Let's Encrypt auto TLS)
  # The ONLY service exposing ports to the host. Routes:
  #   https://pdmrc.doae.go.th        -> frontend (Vue static)
  #   https://pdmrc.doae.go.th/api/*  -> backend-nginx (Laravel API)
  # ---------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: pdm-prod-caddy
    restart: unless-stopped
    depends_on:
      - backend-nginx
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - pdm-net

networks:
  pdm-net:
    driver: bridge

volumes:
  oracle-data:
  caddy-data:
  caddy-config: