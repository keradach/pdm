# ==============================================================================
# PDM - Docker Compose (PRODUCTION DEPLOYMENT)
#
# Runs production stack with:
#   - backend: Laravel 13 (PHP 8.4 FPM) with baked images (no host code mounts)
#   - backend-nginx: Nginx proxy in front of Laravel API
#   - frontend: Static assets served by Nginx with reverse proxy /api/ (:80)
#   - Oracle DB: Connects to external Oracle X8 RAC server via TNS in .env
#                (NO oracle-db container running on production)
#
# Usage:
#   cp .env.production.example .env
#   docker compose up -d --build
#   (Because COMPOSE_FILE=docker-compose.prod.yml in .env)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Laravel Backend (PHP-FPM) - Baked Image (versioned tag)
  #   IMAGE_TAG        = version tag (default: latest)  e.g. v1.2.3, sha-abc1234
  #   IMAGE_REGISTRY   = optional registry prefix       e.g. "ghcr.io/keradach/"
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:8.4-fpm-bookworm}
        ORACLE_ARCH: ${ORACLE_ARCH:-x86_64}
        ORACLE_INSTANTCLIENT_VERSION: ${ORACLE_INSTANTCLIENT_VERSION:-23.26.3.0.0}
        ORACLE_INSTANTCLIENT_ROOT: ${ORACLE_INSTANTCLIENT_ROOT:-2326300}
    image: ${IMAGE_REGISTRY:-}pdm-backend:${IMAGE_TAG:-latest}
    container_name: pdm-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env:ro
    # Optional: หาก Docker container resolve โดเมนภายใน (เช่น efarmer.doae.go.th) ไม่ได้
    # dns:
    #   - 10.2.34.1      # DNS ของเครือข่ายภายใน DOAE
    #   - 8.8.8.8
    # extra_hosts:
    #   - "efarmer.doae.go.th:10.x.x.x"  # แมป IP ตรงใน /etc/hosts ของ container
    networks:
      - pdm-net

  # ----------------------------------------------------------------------------
  # Nginx Web Server for Backend API
  # ----------------------------------------------------------------------------
  backend-nginx:
    image: nginx:1.27-alpine
    container_name: pdm-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro
    networks:
      - pdm-net

  # ----------------------------------------------------------------------------
  # Vue 3 Frontend - Built static assets served by Nginx (:80)
  # Proxies /api/ requests internally to backend-nginx:80
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_ENABLED: ${VITE_API_ENABLED:-true}
    image: ${IMAGE_REGISTRY:-}pdm-frontend:${IMAGE_TAG:-latest}
    container_name: pdm-frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - pdm-net

  # ----------------------------------------------------------------------------
  # Laravel Scheduler (Automates scheduled tasks via schedule:work)
  # ใช้ image เดียวกับ backend (versioned tag เดียวกัน)
  # ----------------------------------------------------------------------------
  scheduler:
    image: ${IMAGE_REGISTRY:-}pdm-backend:${IMAGE_TAG:-latest}
    container_name: pdm-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env:ro
    # Optional: หาก Docker container resolve โดเมนภายใน (เช่น efarmer.doae.go.th) ไม่ได้
    # dns:
    #   - 10.2.34.1      # DNS ของเครือข่ายภายใน DOAE
    #   - 8.8.8.8
    # extra_hosts:
    #   - "efarmer.doae.go.th:10.x.x.x"  # แมป IP ตรงใน /etc/hosts ของ container
    networks:
      - pdm-net
networks:
  pdm-net:
    driver: bridge
