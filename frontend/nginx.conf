# =============================================================================
# PDM Frontend nginx - single entry point behind the org load balancer
#
# TLS (https) is terminated by the organization's central load balancer /
# firewall, which forwards plain HTTP to this server on port 80. So this
# nginx only listens on port 80 and serves:
#   /          -> Vue static assets (built with VITE_API_BASE_URL)
#   /api/*     -> proxies to the Laravel backend (backend-nginx-prod:80)
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Static assets (Vue SPA) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API proxy to Laravel backend ----
    location /api/ {
        proxy_pass http://backend-nginx-prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # ---- Long-lived static assets caching ----
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}