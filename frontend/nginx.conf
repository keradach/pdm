# =============================================================================
# PDM Frontend nginx - single entry point behind the org load balancer
#
# TLS (https) is terminated by the organization's central load balancer /
# firewall, which forwards plain HTTP to this server on port 80. So this
# nginx only listens on port 80 and serves:
#   /          -> Vue static assets (built with VITE_API_BASE_URL)
#   /api/*     -> proxies to the Laravel backend (backend-nginx-prod:80)
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Vue SPA entry point ----
    # index.html MUST never stay cached: it has no content-hash in the filename,
    # so a new deploy changes nothing about its URL. If the browser/CDN holds on
    # to it, users keep the OLD html (which still points to old asset files).
    # no-store ensures every request goes to the server for the fresh html.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ---- Other SPA routes -> fall back to index.html (also no-cache) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---- API proxy to Laravel backend ----
    location /api/ {
        proxy_pass http://backend-nginx-prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # ---- Hashed static assets (CSS/JS/...): Vite already appends a content
    # hash to the filename, so a new build produces NEW urls automatically.
    # Safe to cache forever (immutable).
    location ~* \.(?:css|js|mjs|svg|woff2?|ttf|eot|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}